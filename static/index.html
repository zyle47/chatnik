<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chatnik</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 0.9rem 1.25rem;
    border-bottom: 1px solid #1e293b;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  header h1 { margin: 0; font-size: 1.05rem; font-weight: 600; letter-spacing: 0.02em; }
  header .badge {
    font-size: 0.7rem;
    padding: 0.15rem 0.5rem;
    background: #1e293b;
    border-radius: 999px;
    color: #94a3b8;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
  }
  .msg {
    padding: 0.7rem 1rem;
    border-radius: 1rem;
    max-width: 78%;
    white-space: pre-wrap;
    word-wrap: break-word;
    line-height: 1.45;
  }
  .user { align-self: flex-end; background: #2563eb; color: white; border-bottom-right-radius: 0.3rem; }
  .bot  { align-self: flex-start; background: #1e293b; border-bottom-left-radius: 0.3rem; }
  .err  { background: #7f1d1d; }
  .thinking {
    background: transparent !important;
    padding: 0.4rem 0;
    color: #94a3b8;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  .thinking .glyph {
    color: #f59e0b;
    font-size: 1.15rem;
    animation: pulse 1.2s ease-in-out infinite;
    display: inline-block;
  }
  .thinking .word { color: #cbd5e1; }
  .thinking .dim { color: #64748b; font-size: 0.85rem; }
  @keyframes pulse {
    0%, 100% { opacity: 0.35; transform: scale(0.95); }
    50%      { opacity: 1;    transform: scale(1.1); }
  }
  form {
    padding: 1rem;
    border-top: 1px solid #1e293b;
    display: flex;
    gap: 0.5rem;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
  }
  input[type=text] {
    flex: 1;
    background: #1e293b;
    border: 1px solid #334155;
    color: #e2e8f0;
    padding: 0.75rem 0.9rem;
    border-radius: 0.6rem;
    font-size: 1rem;
  }
  input[type=text]:focus { outline: 2px solid #3b82f6; outline-offset: -1px; border-color: transparent; }
  button {
    background: #2563eb;
    color: white;
    border: 0;
    padding: 0 1.2rem;
    border-radius: 0.6rem;
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 600;
  }
  button:hover { background: #1d4ed8; }
  button:disabled { background: #334155; cursor: not-allowed; }
  .empty {
    align-self: center;
    color: #64748b;
    font-size: 0.9rem;
    margin-top: 30vh;
  }
  .bot p:first-child { margin-top: 0; }
  .bot p:last-child  { margin-bottom: 0; }
  .bot p, .bot ul, .bot ol { margin: 0.5em 0; }
  .bot ul, .bot ol { padding-left: 1.4em; }
  .bot code {
    background: #0b1120;
    padding: 0.1em 0.35em;
    border-radius: 0.3rem;
    font-size: 0.92em;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  .bot pre {
    background: #0b1120;
    padding: 0.85rem 1rem;
    border-radius: 0.6rem;
    overflow-x: auto;
    margin: 0.6em 0;
    border: 1px solid #1e293b;
  }
  .bot pre code {
    background: transparent;
    padding: 0;
    font-size: 0.88rem;
    line-height: 1.5;
    white-space: pre;
  }
  .bot a { color: #60a5fa; }
  .bot blockquote {
    border-left: 3px solid #475569;
    margin: 0.5em 0;
    padding: 0.1em 0.9em;
    color: #cbd5e1;
  }
  .bot h1, .bot h2, .bot h3, .bot h4 {
    margin: 0.6em 0 0.3em;
    font-weight: 600;
  }
</style>
</head>
<body>
<header>
  <h1>Chatnik</h1>
  <span class="badge">very real AI</span>
</header>
<div id="chat">
  <div class="empty" id="empty">ask me anything ↓</div>
</div>
<form id="f">
  <input type="text" id="q" placeholder="Ask anything..." autocomplete="off" autofocus>
  <button type="submit" id="send">Send</button>
</form>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
const chat = document.getElementById('chat');
const form = document.getElementById('f');
const input = document.getElementById('q');
const button = document.getElementById('send');
const empty = document.getElementById('empty');

function addMsg(text, ...classes) {
  if (empty) empty.remove();
  const div = document.createElement('div');
  div.className = ['msg', ...classes].join(' ');
  if (classes.includes('bot') && !classes.includes('err')) {
    div.innerHTML = marked.parse(text);
  } else {
    div.textContent = text;
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

const THINK_WORDS = [
  'Thinking', 'Pondering', 'Mulling', 'Cogitating', 'Brewing',
  'Deliberating', 'Ruminating', 'Recombobulating', 'Befuddling',
  'Synthesizing', 'Marinating', 'Percolating', 'Crystallizing',
  'Conjuring', 'Coalescing', 'Wibbling', 'Schlepping', 'Noodling',
  'Sussing', 'Distilling', 'Reckoning', 'Untangling', 'Concocting',
];
const GLYPHS = ['✻', '✶', '✷', '✸', '✹', '✺', '✽'];

function startThinking() {
  if (empty) empty.remove();
  const div = document.createElement('div');
  div.className = 'msg thinking';
  div.innerHTML =
    '<span class="glyph">✻</span>' +
    '<span class="word">Thinking</span>' +
    '<span class="dim">(<span class="t">0</span>s)</span>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;

  const glyph = div.querySelector('.glyph');
  const word  = div.querySelector('.word');
  const t     = div.querySelector('.t');
  const start = Date.now();

  const ticker = setInterval(() => {
    word.textContent  = THINK_WORDS[Math.floor(Math.random() * THINK_WORDS.length)];
    glyph.textContent = GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
    t.textContent     = Math.floor((Date.now() - start) / 1000);
  }, 900);

  return { node: div, stop: () => clearInterval(ticker) };
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const prompt = input.value.trim();
  if (!prompt) return;

  addMsg(prompt, 'user');
  input.value = '';
  input.disabled = true;
  button.disabled = true;

  const thinking = startThinking();

  try {
    const res = await fetch('/ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({prompt}),
    });
    const data = await res.json();
    thinking.stop();
    thinking.node.remove();
    if (res.ok) {
      addMsg(data.answer, 'bot');
    } else {
      addMsg('Error: ' + (data.detail || res.statusText), 'bot', 'err');
    }
  } catch (err) {
    thinking.stop();
    thinking.node.remove();
    addMsg('Error: ' + err.message, 'bot', 'err');
  } finally {
    input.disabled = false;
    button.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
